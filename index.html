<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Atividades — CMAA</title>
  <!-- Biblioteca Oficial MSAL.js 2.x -->
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
  <style>
    :root {
      /* Paleta da Identidade CMAA + Fundo Claro */
      --bg-main: #f4f6f5;
      --bg-card: #ffffff;
      --bg-sidebar: #ffffff;
      --border: #d5ddd8;
      --text-main: #1f2421;
      --text-muted: #5a655e;
      
      /* Cores da Logo CMAA */
      --cmaa-green-dark: #007934;
      --cmaa-green-mid: #3a9d38;
      --cmaa-lime: #8cc63f;
      --cmaa-charcoal: #2b2b2b;
      
      --accent: var(--cmaa-green-dark);
      --accent-hover: #005e28;
      --success: #1a7f37;
      --warning: #b07800;
      --danger: #cf222e;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; height: 100vh; overflow: hidden; }

    /* --- TELA 1: LOGIN --- */
    #login-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; background: var(--bg-main); gap: 20px; text-align: center; padding: 20px;
      border-top: 6px solid;
      border-image: linear-gradient(90deg, var(--cmaa-lime), var(--cmaa-green-dark)) 1;
    }
    .login-card {
      background: var(--bg-card); padding: 40px 36px; border-radius: 12px;
      border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 420px; width: 100%;
    }
    .login-logo { max-width: 200px; height: auto; }
    #login-screen h1 { font-size: 1.5rem; margin: 4px 0 0 0; color: var(--cmaa-charcoal); }
    #login-screen p { color: var(--text-muted); font-size: 0.95rem; margin: 0 0 8px 0; line-height: 1.5; }

    /* --- TELA 2: LAYOUT PRINCIPAL (APP) --- */
    #app-screen { display: none; height: 100vh; width: 100vw; }
    
    /* Menu Lateral */
    aside {
      width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 20px; gap: 16px; overflow-y: auto; flex-shrink: 0;
    }
    .sidebar-brand {
      display: flex; flex-direction: column; align-items: center; padding-bottom: 16px;
      border-bottom: 1px solid var(--border); gap: 10px;
    }
    .sidebar-logo { max-width: 150px; height: auto; }
    aside h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; margin: 0; color: var(--text-muted); }
    
    .menu-list { display: flex; flex-direction: column; gap: 6px; }
    .menu-item {
      padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; color: var(--cmaa-green-dark);
      background: rgba(0, 121, 52, 0.1); border-color: rgba(0, 121, 52, 0.3); font-weight: 600;
      border-left: 4px solid var(--cmaa-green-dark); display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid transparent;
    }

    /* Conteúdo Principal */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    header {
      background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow);
      border-top: 4px solid;
      border-image: linear-gradient(90deg, var(--cmaa-lime), var(--cmaa-green-dark)) 1;
    }
    .user-info { font-size: 0.85rem; color: var(--text-muted); }

    .content-body { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }

    /* Barra de Ações e Filtros */
    .controls {
      display: flex; gap: 12px; background: var(--bg-card); padding: 16px; border-radius: 8px;
      border: 1px solid var(--border); box-shadow: var(--shadow); align-items: center; flex-wrap: wrap;
    }
    input[type="text"], input[type="date"], select {
      background: #f8faf9; color: var(--text-main); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 6px; outline: none; font-size: 0.9rem;
    }
    input[type="text"]:focus, select:focus, input[type="date"]:focus { border-color: var(--cmaa-green-dark); }
    input[type="text"] { flex: 1; min-width: 200px; }

    /* Botões */
    button {
      background: linear-gradient(135deg, var(--cmaa-green-mid), var(--cmaa-green-dark));
      color: #fff; border: none; padding: 9px 18px;
      border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 0.9rem;
    }
    button:hover { background: var(--accent-hover); box-shadow: 0 2px 6px rgba(0, 121, 52, 0.25); }
    button.secondary { background: #f4f6f5; border: 1px solid var(--border); color: var(--cmaa-charcoal); }
    button.secondary:hover { background: #e8edea; border-color: var(--text-muted); box-shadow: none; }

    /* Seções de Tempo */
    .time-section { display: flex; flex-direction: column; gap: 12px; }
    .time-section h3 {
      font-size: 1rem; margin: 0; padding-bottom: 8px; border-bottom: 2px solid var(--border);
      color: var(--cmaa-charcoal); display: flex; align-items: center; justify-content: space-between;
    }
    .count-pill {
      font-size: 0.75rem; background: #e6ece8; color: var(--cmaa-charcoal);
      padding: 2px 10px; border-radius: 12px; font-weight: 600;
    }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    
    /* Cards */
    .card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
      box-shadow: var(--shadow); transition: transform 0.2s;
      border-left: 4px solid var(--cmaa-charcoal);
    }
    .card:hover { transform: translateY(-2px); }
    .card.completed { opacity: 0.65; border-left: 4px solid var(--cmaa-green-dark); }
    .card.in-progress { border-left: 4px solid var(--cmaa-lime); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .task-title { font-weight: 600; font-size: 0.95rem; margin: 0; line-height: 1.4; color: var(--text-main); }
    
    .badge {
      font-size: 0.7rem; padding: 3px 8px; border-radius: 12px;
      background: rgba(0, 121, 52, 0.12); color: var(--cmaa-green-dark); white-space: nowrap; font-weight: 600;
    }
    .badge.progress { background: rgba(140, 198, 63, 0.25); color: #4b7312; }
    .badge.pending { background: rgba(43, 43, 43, 0.1); color: var(--cmaa-charcoal); }

    .meta { font-size: 0.8rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }
    .actions { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
    .actions button { flex: 1; font-size: 0.78rem; padding: 6px 8px; }

    /* Modal */
    dialog {
      background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border);
      border-radius: 8px; padding: 24px; width: 90%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  </style>
</head>
<body>

  <!-- TELA 1: LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <img src="CMAA.png" alt="Logo CMAA" class="login-logo">
      <h1>Gestão de Atividades</h1>
      <p>Acesse com sua conta corporativa Microsoft para gerenciar as tarefas do Chamados G&G.</p>
      <button onclick="signIn()" style="width: 100%; padding: 12px 24px; font-size: 1rem;">Entrar com Microsoft</button>
    </div>
  </div>

  <!-- TELA 2: GESTÃO -->
  <div id="app-screen" style="display: none;">
    
    <!-- Menu Lateral -->
    <aside>
      <div class="sidebar-brand">
        <img src="CMAA.png" alt="Logo CMAA" class="sidebar-logo">
      </div>
      <h2>Navegação</h2>
      <div class="menu-list">
        <div class="menu-item">📋 Atividades (Chamados G&G)</div>
      </div>
    </aside>

    <!-- Conteúdo Principal -->
    <div class="main-content">
      <header>
        <div>
          <h2 id="current-plan-title" style="margin:0; font-size: 1.2rem; color: var(--cmaa-charcoal);">Chamados G&G</h2>
          <span id="user-info" class="user-info">Carregando usuário...</span>
        </div>
        <button class="secondary" onclick="signOut()">Sair</button>
      </header>

      <div class="content-body">
        
        <!-- VISÃO DE ATIVIDADES -->
        <div class="controls">
          <input type="text" id="filter-search" placeholder="🔍 Pesquisar por nome da atividade ou responsável..." oninput="renderTasks()">
          
          <select id="filter-bucket" onchange="renderTasks()">
            <option value="">Todos os Buckets (Colunas)</option>
          </select>

          <select id="filter-status" onchange="renderTasks()">
            <option value="open">Pendentes e Em Andamento</option>
            <option value="all">Todas as Tarefas</option>
            <option value="completed">Concluídas (100%)</option>
          </select>

          <button class="secondary" onclick="loadChamadosPlan()">↻ Atualizar</button>
        </div>

        <div class="time-section">
          <h3><span>⚡ Criadas esta semana</span><span id="count-week" class="count-pill">0</span></h3>
          <div id="grid-week" class="grid"></div>
        </div>

        <div class="time-section">
          <h3><span>📅 Criadas este mês</span><span id="count-month" class="count-pill">0</span></h3>
          <div id="grid-month" class="grid"></div>
        </div>

        <div class="time-section">
          <h3><span>🗂️ Outras (Anteriores)</span><span id="count-others" class="count-pill">0</span></h3>
          <div id="grid-others" class="grid"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal de Edição -->
  <dialog id="edit-modal">
    <h3 style="margin-top:0; color: var(--cmaa-charcoal);">Editar Atividade</h3>
    <input type="hidden" id="edit-task-id">
    <input type="hidden" id="edit-task-etag">
    
    <div class="form-group">
      <label>Título da Tarefa</label>
      <input type="text" id="edit-title">
    </div>
    
    <div class="form-group">
      <label>Progresso</label>
      <select id="edit-progress">
        <option value="0">Não Iniciada (0%)</option>
        <option value="50">Em Andamento (50%)</option>
        <option value="100">Concluída (100%)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Data de Conclusão (Prazo)</label>
      <input type="date" id="edit-due">
    </div>

    <div class="modal-footer">
      <button class="secondary" onclick="document.getElementById('edit-modal').close()">Cancelar</button>
      <button onclick="saveTaskEdit()">Salvar Alterações</button>
    </div>
  </dialog>

<script>
  // =========================================================================
  // CONFIGURAÇÃO DO ENTRA ID
  // =========================================================================
  const msalConfig = {
    auth: {
      clientId: "92b0526e-e8f0-4cca-a711-b557e5c15fbc",
      authority: "https://login.microsoftonline.com/ca4b9034-c4ac-4ca2-b97e-1e57700b0d20",
      redirectUri: window.location.origin + "/" 
    },
    cache: { cacheLocation: "sessionStorage", storeAuthStateInCookie: false }
  };

  const graphScopes = ["User.Read", "Tasks.ReadWrite", "Group.Read.All", "Directory.Read.All"];
  const msalInstance = new msal.PublicClientApplication(msalConfig);

  let currentAccount = null;
  let allTasks = [];
  let bucketsMap = {}; 
  let userCache = {};  
  let chamadosPlanId = null;

  window.addEventListener("DOMContentLoaded", () => {
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) {
      currentAccount = accounts[0];
      showAppScreen();
      findChamadosPlan();
    }
  });

  async function signIn() {
    try {
      const loginResponse = await msalInstance.loginPopup({ scopes: graphScopes });
      currentAccount = loginResponse.account;
      showAppScreen();
      findChamadosPlan();
    } catch (error) {
      console.error("Erro no login:", error);
      alert("Falha na autenticação. Verifique o console.");
    }
  }

  function signOut() {
    msalInstance.logoutPopup({ account: currentAccount });
  }

  function showAppScreen() {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app-screen").style.display = "flex";
    document.getElementById("user-info").innerText = `${currentAccount.name} (${currentAccount.username})`;
  }

  async function getAccessToken() {
    const request = { scopes: graphScopes, account: currentAccount };
    try {
      const response = await msalInstance.acquireTokenSilent(request);
      return response.accessToken;
    } catch (error) {
      const response = await msalInstance.acquireTokenPopup(request);
      return response.accessToken;
    }
  }

  async function graphFetch(endpoint, method = "GET", body = null, etag = null) {
    const token = await getAccessToken();
    const headers = { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
    if (etag) headers["If-Match"] = etag;
    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);

    const response = await fetch(`https://graph.microsoft.com/v1.0${endpoint}`, options);
    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`Erro Graph (${response.status}): ${errText}`);
    }
    return response.status === 204 ? null : response.json();
  }

  async function findChamadosPlan() {
    try {
      const groupsData = await graphFetch("/me/memberOf?$select=id,displayName");
      const groups = groupsData.value.filter(g => g["@odata.type"] === "#microsoft.graph.group");

      for (const group of groups) {
        if (!group.displayName.toLowerCase().includes("chamados g&g")) continue;
        const plansData = await graphFetch(`/groups/${group.id}/planner/plans`);
        if (plansData.value && plansData.value.length > 0) {
          chamadosPlanId = plansData.value[0].id;
          document.getElementById("current-plan-title").innerText = `${group.displayName} ➔ ${plansData.value[0].title}`;
          loadChamadosPlan();
          return;
        }
      }
      alert("Nenhum plano encontrado para 'Chamados G&G'.");
    } catch (error) {
      console.error("Erro ao localizar plano:", error);
    }
  }

  async function loadChamadosPlan() {
    if (!chamadosPlanId) return;

    try {
      const bucketsData = await graphFetch(`/planner/plans/${chamadosPlanId}/buckets`);
      bucketsMap = {};
      let bucketSelectHtml = '<option value="">Todos os Buckets (Colunas)</option>';
      (bucketsData.value || []).forEach(b => {
        bucketsMap[b.id] = b.name;
        bucketSelectHtml += `<option value="${b.id}">${b.name}</option>`;
      });
      document.getElementById("filter-bucket").innerHTML = bucketSelectHtml;

      const tasksData = await graphFetch(`/planner/plans/${chamadosPlanId}/tasks`);
      allTasks = (tasksData.value || []).sort((a, b) => new Date(b.createdDateTime) - new Date(a.createdDateTime));
      renderTasks();
    } catch (error) {
      console.error(error);
    }
  }

  async function getAssigneeNames(assignments) {
    if (!assignments || Object.keys(assignments).length === 0) return "Não atribuída";
    let names = [];
    for (const userId of Object.keys(assignments)) {
      if (!userCache[userId]) {
        try {
          const user = await graphFetch(`/users/${userId}?$select=displayName`);
          userCache[userId] = user.displayName;
        } catch {
          userCache[userId] = "Usuário";
        }
      }
      names.push(userCache[userId]);
    }
    return names.join(", ");
  }

  async function renderTasks() {
    const searchText = document.getElementById("filter-search").value.toLowerCase();
    const selectedBucket = document.getElementById("filter-bucket").value;
    const statusFilter = document.getElementById("filter-status").value;

    const gridWeek = document.getElementById("grid-week");
    const gridMonth = document.getElementById("grid-month");
    const gridOthers = document.getElementById("grid-others");

    gridWeek.innerHTML = gridMonth.innerHTML = gridOthers.innerHTML = "<p style='color:var(--text-muted); font-size:0.85rem;'>Carregando...</p>";

    let filtered = allTasks.filter(t => {
      if (statusFilter === "open" && t.percentComplete === 100) return false;
      if (statusFilter === "completed" && t.percentComplete !== 100) return false;
      if (selectedBucket && t.bucketId !== selectedBucket) return false;
      return true;
    });

    const now = new Date();
    const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay(), 0, 0, 0);
    const endOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (6 - now.getDay()), 23, 59, 59);

    let weekHtml = "", monthHtml = "", othersHtml = "";
    let weekCount = 0, monthCount = 0, othersCount = 0;

    for (const task of filtered) {
      const assigneeName = await getAssigneeNames(task.assignments);

      if (searchText && !task.title.toLowerCase().includes(searchText) && !assigneeName.toLowerCase().includes(searchText)) {
        continue;
      }

      const isDone = task.percentComplete === 100;
      const isProgress = task.percentComplete > 0 && task.percentComplete < 100;
      
      let statusLabel = "Não iniciada";
      let badgeClass = "pending";
      let cardClass = "";

      if (isDone) { statusLabel = "Concluída"; badgeClass = ""; cardClass = "completed"; }
      else if (isProgress) { statusLabel = "Em andamento"; badgeClass = "progress"; cardClass = "in-progress"; }

      const createdFormatted = task.createdDateTime ? new Date(task.createdDateTime).toLocaleDateString("pt-BR") : "N/D";
      const dueFormatted = task.dueDateTime ? new Date(task.dueDateTime).toLocaleDateString("pt-BR", { timeZone: "UTC" }) : "Sem prazo";
      const bucketName = bucketsMap[task.bucketId] || "Geral";
      const safeEtag = task["@odata.etag"].replace(/"/g, '&quot;');

      const cardHtml = `
        <div class="card ${cardClass}">
          <div>
            <div class="card-header">
              <p class="task-title">${task.title}</p>
              <span class="badge ${badgeClass}">${statusLabel}</span>
            </div>
            <div class="meta" style="margin-top:8px;">
              <span>📌 <strong>Bucket:</strong> ${bucketName}</span>
              <span>👤 <strong>Responsável:</strong> ${assigneeName}</span>
              <span>🕒 <strong>Criada em:</strong> ${createdFormatted}</span>
              <span>📅 <strong>Prazo:</strong> ${dueFormatted}</span>
            </div>
          </div>

          <div class="actions">
            <button class="secondary" onclick="openEditModal('${task.id}')">✏️ Editar</button>
            ${!isDone ? `<button onclick="quickUpdateStatus('${task.id}', '${safeEtag}', 100)">✔ Concluir</button>` : ''}
          </div>
        </div>
      `;

      if (!task.createdDateTime) {
        othersHtml += cardHtml; othersCount++;
      } else {
        const createdDate = new Date(task.createdDateTime);
        if (createdDate >= startOfWeek && createdDate <= endOfWeek) {
          weekHtml += cardHtml; weekCount++;
        } else if (createdDate.getMonth() === now.getMonth() && createdDate.getFullYear() === now.getFullYear()) {
          monthHtml += cardHtml; monthCount++;
        } else {
          othersHtml += cardHtml; othersCount++;
        }
      }
    }

    document.getElementById("count-week").innerText = weekCount;
    document.getElementById("count-month").innerText = monthCount;
    document.getElementById("count-others").innerText = othersCount;

    gridWeek.innerHTML = weekCount > 0 ? weekHtml : "<p style='color:var(--text-muted); font-size:0.85rem;'>Nenhuma tarefa criada nesta semana.</p>";
    gridMonth.innerHTML = monthCount > 0 ? monthHtml : "<p style='color:var(--text-muted); font-size:0.85rem;'>Nenhuma tarefa criada neste mês.</p>";
    gridOthers.innerHTML = othersCount > 0 ? othersHtml : "<p style='color:var(--text-muted); font-size:0.85rem;'>Nenhuma tarefa anterior.</p>";
  }

  async function quickUpdateStatus(taskId, etag, newPercent) {
    try {
      const payload = { percentComplete: newPercent };
      if (newPercent === 100) {
        payload.completedDateTime = new Date().toISOString();
      }
      await graphFetch(`/planner/tasks/${taskId}`, "PATCH", payload, etag);
      loadChamadosPlan();
    } catch (error) {
      alert("Erro ao atualizar status. Atualizando lista...");
      loadChamadosPlan();
    }
  }

  function openEditModal(taskId) {
    const task = allTasks.find(t => t.id === taskId);
    if (!task) return;

    document.getElementById("edit-task-id").value = task.id;
    document.getElementById("edit-task-etag").value = task["@odata.etag"];
    document.getElementById("edit-title").value = task.title;
    document.getElementById("edit-progress").value = task.percentComplete;
    document.getElementById("edit-due").value = task.dueDateTime ? task.dueDateTime.split("T")[0] : "";

    document.getElementById("edit-modal").showModal();
  }

  async function saveTaskEdit() {
    const id = document.getElementById("edit-task-id").value;
    const etag = document.getElementById("edit-task-etag").value;
    const title = document.getElementById("edit-title").value.trim();
    const percentComplete = parseInt(document.getElementById("edit-progress").value, 10);
    const dueDate = document.getElementById("edit-due").value;

    const payload = {
      title: title,
      percentComplete: percentComplete,
      dueDateTime: dueDate ? `${dueDate}T18:00:00Z` : null
    };

    if (percentComplete === 100) {
      payload.completedDateTime = new Date().toISOString();
    }

    try {
      await graphFetch(`/planner/tasks/${id}`, "PATCH", payload, etag);
      document.getElementById("edit-modal").close();
      loadChamadosPlan();
    } catch (error) {
      alert("Erro ao salvar edição: " + error.message);
    }
  }
</script>
</body>
</html>
